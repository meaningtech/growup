services:
  postgis:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_DB: growaf
      POSTGRES_USER: growaf
      POSTGRES_PASSWORD: growaf
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U growaf -d growaf"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - growaf-postgis:/var/lib/postgresql/data

volumes:
  growaf-postgis:
