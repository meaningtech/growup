services:
  postgis:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_DB: growup
      POSTGRES_USER: growup
      POSTGRES_PASSWORD: growup
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U growup -d growup"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - growup-postgis:/var/lib/postgresql/data

volumes:
  growup-postgis:
